name: Check Internal Markdown Links

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate relative links
        run: python tools/validate_links.py
